name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The DJ workflow or problem behind the idea, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How it could work in Key Master.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or how other tools (Rekordbox, Mixed In Key, ...) handle it.
